services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    # If you have an NVIDIA GPU and the nvidia-container-toolkit installed,
    # uncomment this to run Ollama on the GPU instead of CPU (much faster).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - OLLAMA_HOST=ollama:11434 ollama pull ${OLLAMA_MODEL:-qwen3.5:4b}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434/v1"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3.5:4b}"
      JWT_SECRET: "lotwise-takehome-not-a-real-secret"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama_data:
